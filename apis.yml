- aid: amberdata:defi
  name: Amberdata DeFi API
  tags:
  - DeFi
  - DEX
  - Lending
  - Uniswap
  - Liquidity
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.amberdata.io/reference/defi-reference
  baseURL: https://api.amberdata.com
  properties:
  - url: https://docs.amberdata.io/reference/defi-reference
    type: Documentation
  - url: openapi/amberdata-openapi.yml
    type: OpenAPI
  description: Decentralized finance data covering DEX pair prices, trades and liquidity
    (e.g. Uniswap V3), and lending protocol, asset, and wallet position metrics.
- aid: amberdata:on-chain
  name: Amberdata On-Chain API
  tags:
  - On-Chain
  - Blockchain
  - Blocks
  - Transactions
  - Addresses
  - Tokens
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.amberdata.io/docs/transactions
  baseURL: https://api.amberdata.com
  properties:
  - url: https://docs.amberdata.io/docs/transactions
    type: Documentation
  - url: openapi/amberdata-openapi.yml
    type: OpenAPI
  description: On-chain blockchain data across supported networks - blocks, transactions,
    addresses (balances, token balances, transactions), tokens (information, transfers,
    holders), and account balances, sourced from Amberdata's own full nodes from
    the genesis block forward.
- aid: amberdata:websocket-streaming
  name: Amberdata WebSocket Streaming API
  tags:
  - WebSocket
  - Streaming
  - Real Time
  - Low Latency
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.amberdata.io/real-time/websocket-getting-started
  baseURL: wss://ws.web3api.io
  properties:
  - url: https://docs.amberdata.io/real-time/websocket-getting-started
    type: Documentation
  - url: https://docs.amberdata.io/reference/ws-connection
    type: APIReference
  - url: asyncapi/amberdata-asyncapi.yml
    type: AsyncAPI
  description: Low-latency real-time WebSocket streaming over a JSON-RPC 2.0 subscribe
