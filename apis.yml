aid: amberdata
url: https://raw.githubusercontent.com/api-evangelist/amberdata/refs/heads/main/apis.yml
name: Amberdata
kind: company
description: Amberdata delivers institutional-grade digital asset and blockchain
  data through its REST API at https://api.amberdata.com. Coverage spans spot market
  data (prices, OHLCV, tickers, trades, order books), derivatives across futures and
  options (funding rates, open interest, liquidations, implied volatility, Greeks),
  DeFi (DEX trades and lending), and on-chain blockchain data (blocks, transactions,
  addresses, tokens, transfers), plus low-latency WebSocket streaming.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Crypto
- Blockchain
- Market Data
- Digital Assets
- Derivatives
- DeFi
- On-Chain
created: '2026-06-21'
modified: '2026-06-21'
specificationVersion: '0.19'
apis:
- aid: amberdata:spot-market-data
  name: Amberdata Spot Market Data API
  tags:
  - Spot
  - Market Data
  - Prices
  - OHLCV
  - Trades
  - Order Books
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.amberdata.io/reference/spot-reference
  baseURL: https://api.amberdata.com
  properties:
  - url: https://docs.amberdata.io/http/http-api-fundamentals
    type: Documentation
  - url: https://docs.amberdata.io/reference/spot-reference
    type: APIReference
  - url: openapi/amberdata-openapi.yml
    type: OpenAPI
  - url: asyncapi/amberdata-asyncapi.yml
    type: AsyncAPI
  description: Spot market data across supported exchanges - reference rates, prices,
    OHLCV, tickers, historical trades, and order book snapshots and events for any
    traded pair (e.g. eth_usd, btc_usd).
- aid: amberdata:derivatives
  name: Amberdata Derivatives API
  tags:
  - Derivatives
  - Futures
  - Options
  - Funding Rates
  - Open Interest
  - Implied Volatility
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.amberdata.io/reference/futures-exchanges-reference
  baseURL: https://api.amberdata.com
  properties:
  - url: https://docs.amberdata.io/http/analytics/derivatives/instruments-information
    type: Documentation
  - url: https://docs.amberdata.io/reference/futures-exchanges-reference
