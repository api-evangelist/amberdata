aid: amberdata
url: https://raw.githubusercontent.com/api-evangelist/amberdata/refs/heads/main/apis.yml
name: Amberdata
kind: company
description: Amberdata delivers institutional-grade digital asset and blockchain
  data through its REST API at https://api.amberdata.com. Coverage spans spot market
  data (prices, OHLCV, tickers, trades, order books), derivatives across futures and
  options (funding rates, open interest, liquidations, implied volatility, Greeks),
  DeFi (DEX trades and lending), and on-chain blockchain data (blocks, transactions,
  addresses, tokens, transfers), plus low-latency WebSocket streaming.
