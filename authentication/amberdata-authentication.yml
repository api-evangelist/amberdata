notes: >-
  Every REST request requires the user-specific x-api-key header (requests
  without a valid key are refused); key types encode the subscription tier
  (UAT trial, UAO on-demand, UAK enterprise). WebSocket connections to
  wss://ws.web3api.io authenticate with the same x-api-key header on the
  upgrade request. An optional dated api-version header selects the API
  version. No OAuth surface is published.
