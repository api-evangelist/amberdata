- FinOps
- Cost Management
- FOCUS
description: >-
  FinOps view of Amberdata spend. Amberdata bills via sales-led enterprise
  licenses and, for some market data, self-service exchange-based
  subscriptions. Charges are predominantly recurring subscription / license
  fees scoped to selected data domains (spot, futures, options, DeFi, on-chain)
  and delivery channels (REST API, WebSockets, AWS S3, Snowflake). Public list
  prices are not published; cost figures are not reconciled in this artifact.
notes: >-
  Subscription and license rates are quote-based and subject to negotiation;
  verify against an active Amberdata agreement during reconciliation.
sources:
- https://www.amberdata.io/pricing
- https://www.amberdata.io/delivery
- https://focus.finops.org/focus-specification/v1-3/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Amberdata
serviceCategory: Analytics and Data
billingModel:
  pricingCategory: Subscription-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
focusColumns:
  ServiceName: Amberdata API
  ServiceCategory: Analytics and Data
  ProviderName: Amberdata
  PublisherName: Amberdata
  InvoiceIssuerName: Amberdata
  BillingCurrency: USD
  ChargeCategory: Purchase
  PricingCategory: Subscription-Based
meters:
- name: market_data_subscription
  description: Recurring subscription fee for selected spot / futures / options exchange market data.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - domain
  - exchange
- name: enterprise_license
  description: Enterprise license fee covering contracted data domains and delivery channels.
  unit: contract
  aggregation: sum
  dimensions:
  - account
  - domain
- name: data_delivery
  description: Delivery-channel entitlement (REST API, WebSockets, AWS S3, Snowflake) included in the agreement.
  unit: channel
  aggregation: sum
  dimensions:
  - account
  - channel
principles:
- name: Visibility
  description: Track which data domains (spot, derivatives, DeFi, on-chain) and delivery channels are licensed and used.
- name: Allocation
  description: Map API keys and subscriptions to teams / cost centers consuming each data domain.
- name: Optimization
  description: License only the exchanges, domains, and historical depth actually required; consolidate delivery channels.
- name: Accountability
  description: Assign owners per subscription / license; review renewals and usage against budget.
maintainers:
