                        type: string
                        description: Hex string containing the compiled contract bytecode
                        example: 0x60806040...
                      contractName:
                        type: string
                        example: CryptoKitties
                      source:
                        type: string
                        description: Solidity source code
                        example: |
                          pragma solidity ^0.4.11;

                          contract Example {
                              // Contract body...
                          }
                  status:
                    type: integer
                    example: 200
                  title:
                    type: string
                    example: OK
