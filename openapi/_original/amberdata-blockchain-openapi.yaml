            default: ethereum-mainnet
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  description:
                    type: string
                    example: Successful request
                  payload:
                    type: object
                    properties:
                      abi:
                        type: array
                        description: Ethereum smart contract ABI
                        items:
                          type: object
                          properties:
                            constant:
                              type: boolean
                              example: true
                            inputs:
                              type: array
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                    example: _interfaceID
                                  type:
                                    type: string
                                    example: bytes4
                            name:
                              type: string
                              example: supportsInterface
                            outputs:
                              type: array
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                    example: ''
                                  type:
                                    type: string
                                    example: bool
                            payable:
                              type: boolean
                              example: false
                            stateMutability:
                              type: string
                              example: view
                            type:
                              type: string
                              example: function
