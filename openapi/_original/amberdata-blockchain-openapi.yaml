  /tokens/{hash}/supplies/historical:
    get:
      summary: Token Supplies by Address Historical
      description: >-
        Retrieves the historical token supplies (and derivatives) for the
        specified address.


        Note: This endpoint returns a max of 6 months of historical data. In
        order to get more than 6 months you must use the `startDate`  &
        `endDate` parameters to move the time frame window to get the next
        ***n*** days/months of data.
      operationId: get-historical-token-supply
      parameters:
        - name: hash
          in: path
          description: The address for which to retrieve token supply. (example is MKR)
          schema:
            type: string
            default: '0x9f8f72aa9304c8b593d555f12ef6589cc3a579a2'
          required: true
        - name: startDate
          in: query
          description: >-
            Filter by token prices after this date - note that the interval can
            not exceed 6 months (d), or 30 days (h).
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: >-
            Filter by token prices before this date - note that the interval can
            not exceed 6 months (d), or 30 days (h).
          schema:
            type: string
            format: date-time
        - name: timeInterval
          in: query
          description: >-
            The time interval to return the historical data in: by day (days) or
            by hour (hours).
          schema:
            type: string
            default: days
        - name: timeFormat
          in: query
          description: >-
            **[Optional]** Time format of the timestamps in the return
            payload.<BR/>**[Defaults]** `milliseconds | ms* | iso | iso8601 | hr
            | human_readable`
          schema:
            type: string
            default: ms
        - name: x-amberdata-blockchain-id
          in: header
          description: The id of the blockchain
          schema:
            type: string
            enum:
              - ethereum-mainnet
              - polygon-mainnet
            default: ethereum-mainnet
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                    default: 0
                  title:
                    type: string
                    example: OK
                  description:
                    type: string
                    example: Successful request
                  payload:
                    type: object
                    properties:
                      metadata:
                        type: object
                        properties:
                          columns:
                            type: array
                            items:
                              type: string
                            example:
                              - timestamp
                              - numHolders
                              - circulatingSupply
                              - totalSupply
                          startDate:
                            type: integer
                            format: int64
                            example: 1573257600000
                          endDate:
                            type: integer
                            format: int64
                            example: 1575849600000
                          decimals:
                            type: string
                            example: '18'
                      data:
                        type: array
                        description: Array of rows, each row matches metadata.columns
                        items:
                          type: array
                          minItems: 4
                          maxItems: 4
                          items:
                            oneOf:
                              - type: integer
                              - type: string
                          example:
                            - 1573257600000
                            - 15460
                            - '1000000000000000000000000'
                            - '1000000000000000000000000'
        '400':
          description: '400'
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
      deprecated: false
      security:
        - ApiKeyAuth: []
