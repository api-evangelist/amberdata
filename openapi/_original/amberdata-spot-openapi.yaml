            **[Examples]** `1578531600 | 1578531600000 | 2025-02-27`
          schema:
            type: string
            default: '2025-06-01'
        - name: endDate
          in: query
          required: false
          description: |-
            **[Optional]** Payload only includes data up to this date.
            **[Formats]** `seconds | milliseconds | iso8601` 
            **[Examples]** `1578531600 | 1578531600000 | 2025-02-28`
          schema:
            type: string
            default: '2025-06-02'
        - name: timeInterval
