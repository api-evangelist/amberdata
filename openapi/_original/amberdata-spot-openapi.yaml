  /volumes/asset:
    get:
      summary: Asset Volume USD
      description: >-
        This endpoint displays the total volume per base asset or specifc pair,
        normalized to USD. This means that crypto-to-crypto pairs (such as
        ETH_BTC) are converted to USD before aggregation. Users can pass an
        optional boolean parameter to include pairs where the asset is on the
        quote side, example xyz_btc where btc is target asset.
      operationId: spot-analytics-volumes-exchange
      parameters:
        - name: exchange
          in: query
          required: true
          description: |-
            **[Required]** The exchange for which to retrieve asset USD volume.
            **[Examples]** ` gdax | okex | binance | binanceus`
          schema:
            type: string
            default: gdax
        - name: asset
          in: query
          required: true
          description: |-
            **[Required]** The exchange for which to retrieve asset USD volume.
            **[Examples]** ` btc | eth | sol | xrp`
          schema:
            type: string
            default: btc
        - name: quoteAssetIncluded
          in: query
          required: true
          description: >-
            **[Required]** Whether the USD asset volumes from the quote side are
            included.

            **[Examples]** ` gdax | okex | binance | binanceus`
          schema:
            type: boolean
            default: false
        - name: pair
          in: query
          required: false
          description: >-
            **[Optional]** The parameter to isolate USD volume to only a
            specific pair.

            **[Examples]** ` btc_usd | eth_usdt | sol_usd | xrp_usdc`
          schema:
            type: string
            default: null
        - name: startDate
          in: query
          required: false
          description: >-
            **[Optional]** Payload only includes data after this date
            (inclusive).

            **[Formats]** `seconds | milliseconds | iso8601` 

            **[Examples]** `1578531600 | 1578531600000 | 2025-02-27`
