      summary: Exchange Statistics
      description: >-
        Retrieve the **latest** known instruments statistics from exchanges that
        Amberdata supports.
      operationId: asset-reference-classification-exchange-statistics
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    status: 200
                    title: OK
                    description: Successful request
                    payload:
                      metadata:
