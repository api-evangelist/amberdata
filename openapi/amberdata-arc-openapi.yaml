                            instrumentsSpot: 639
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                    default: 0
                  title:
                    type: string
                    example: OK
                  description:
                    type: string
                    example: Successful request
                  payload:
                    type: object
                    properties:
                      metadata:
                        type: object
                        properties:
                          next: {}
                      data:
                        type: object
                        properties:
                          lastUpdatedAt:
                            type: integer
                            example: 1733246810233
                            default: 0
                          totalExchanges:
                            type: integer
                            example: 22
