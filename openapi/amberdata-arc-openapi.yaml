                          - exchange: bithumb
                            instrumentsSpot: 617
                          - exchange: bitmex
                            instrumentsSpot: 20
                          - exchange: bitstamp
                            instrumentsSpot: 271
                          - exchange: bybit
                            instrumentsSpot: 751
                          - exchange: cboedigital
                            instrumentsSpot: 10
                          - exchange: ftx
                            instrumentsSpot: 621
                          - exchange: ftxus
                            instrumentsSpot: 67
                          - exchange: gdax
                            instrumentsSpot: 721
                          - exchange: gemini
                            instrumentsSpot: 274
                          - exchange: huobi
                            instrumentsSpot: 1905
                          - exchange: itbit
                            instrumentsSpot: 14
                          - exchange: kraken
                            instrumentsSpot: 1350
                          - exchange: lmax
                            instrumentsSpot: 46
                          - exchange: mercadobitcoin
                            instrumentsSpot: 701
                          - exchange: mexc
                            instrumentsSpot: 5853
