  /dex/information:
    get:
      summary: DEX Protocols Information
      description: >-
        Retrieves information about the supported liquidity pools across
        blockchains and DEX protocols.
      operationId: dex-all-blockchains-information
      parameters:
        - name: activeAfterDate
          in: query
          description: >-
            Filter by date to find liquidity pools that have been active after
            the specified date<br><br>**Examples**: `2025-02-05`
          schema:
            type: string
            format: date-time
        - name: blockchain
          in: query
          description: Filter for liquidity pools on just this network/blockchain.
          required: true
          schema:
            type: string
            enum:
              - ethereum-mainnet
              - polygon-mainnet
              - arbitrum-mainnet
              - bnb-mainnet
              - optimism-mainnet
              - avalanche-mainnet
            default: ethereum-mainnet
        - name: protocolName
          in: query
          description: Filter by a protocol of interest
          schema:
            type: string
        - name: liquidityPoolAddress
          in: query
          description: Filter by the smart contract address of the liquidity pool
          schema:
            type: string
        - name: assetAddress
          in: query
          description: Filter by the smart contract address for an asset of interest
          schema:
            type: string
        - name: assetSymbol
          in: query
          description: >-
            Filter by the short-form identifier of an asset.<br><br> **We
            recommended using `assetAddress` as assets can have duplicate
            symbols on-chain.**
          schema:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                    default: 0
                  title:
                    type: string
                    example: OK
                  description:
                    type: string
                    example: Successful request
                  payload:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            blockchain:
                              type: string
                              example: arbitrum-mainnet
                            firstKnownTradeDate:
                              type: string
                              example: '2024-12-06T08:37:49.000Z'
                            lastKnownTradeDate:
                              type: string
                              example: '2024-12-19T23:59:59.000Z'
                            liquidityPoolAddress:
                              type: string
                              example: '0xbb4c7c0380f13c0bb947ac08db20af18898d9cfb'
                            liquidityPoolFees:
                              type: number
                              example: 13.400999999999994
                            poolComposition:
                              type: array
                              items:
                                type: object
                                properties:
                                  assetAddress:
                                    type: string
                                    example: '0x82af49447d8a07e3bd95bd0d56f35241523fbab1'
                                  assetDecimals:
                                    type: integer
                                    example: 18
                                  assetSymbol:
                                    type: string
                                    example: weth
                            protocolName:
                              type: string
                              example: uniswap_v3
      deprecated: false
