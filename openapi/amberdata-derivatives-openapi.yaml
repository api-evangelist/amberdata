  /analytics/realized-volatility/seasonality/day-of-week:
    get:
      summary: 'Seasonality: Volatility Day of Week'
      description: >-
        This endpoint returns the average realized volatility, for a select date
        range, grouped by the day-of-the-week. Users can view how weekend
        volatility compares to say, Wednesday realized volatility, etc.
      operationId: derivatives-realized-volatility-seasonality-day-of-the-week
      parameters:
        - name: exchange
          in: query
          description: >-
            **[Required]**  The exchange for which to retrieve the volatility
            cone. 

            **[Examples]** `gdax`
          required: true
          schema:
            type: string
            default: gdax
        - name: pair
          in: query
          description: >-
            **[Required]** The underlying pair for which to retrieve the
            volatility cone. 

            **[Examples]** `btc_usd`
          required: true
          schema:
            type: string
            default: btc_usd
        - name: startDate
          in: query
          description: >-
            **[Optional]** Payload only includes data after this date
            (inclusive). 

            **[Formats]** `seconds | milliseconds | iso8601`

            **[Examples]** `1578531600 | 1578531600000 | 2020-09-01T01:00:00`
          schema:
            type: string
            format: date-time
            default: '2020-01-01'
        - name: endDate
          in: query
          description: >-
            **[Optional]** Payload only includes data before this date
            (exclusive). 

            **[Formats]** `seconds | milliseconds | iso8601`

            **[Examples]** `1578531600 | 1578531600000 | 2020-09-01T01:00:00`
          schema:
            type: string
            format: date-time
            default: '2024-06-01'
        - name: timeFormat
          in: query
          description: >-
            **[Optional]** Time format of the timestamps in the return payload.

            **[Defaults]** `milliseconds | ms* | iso | iso8601 | hr |
            human_readable`
          schema:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  title:
                    type: string
                    example: OK
                  description:
                    type: string
                    example: Successful request
                  payload:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            weekday:
                              type: string
                              example: MON
                              description: >-
                                The day of the week abbreviation (MON, TUES,
                                WED, THURS, FRI, SAT, SUN)
                            historicalVolatility1day:
                              type: number
                              example: 47.63749442254257
                              description: >-
                                The average historical volatility for this day
                                of the week over the specified date range
              examples:
                Result:
                  value:
                    status: 200
                    title: OK
                    description: Successful request
                    payload:
                      data:
                        - weekday: MON
                          historicalVolatility1day: 47.63749442254257
