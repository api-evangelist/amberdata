  /analytics/futures-perpetuals/liquidations-total:
    get:
      summary: Liquidations Aggregate (Futures and Perpetuals)
      description: >-
        This endpoint returns the total aggregated liquidations for both futures
        and perpetuals for a selected time interval and exchange venue. The
        liquidations are split into "Buy-To-Close" and "Sell-To-Close" buckets.
        The endpoint is dynamic in terms of granularity. 1-day of data returns
        5-min, 7-days returns hourly, 30-days returns daily.
      operationId: derivatives-futures-perpetuals-liquidations-aggregates
      parameters:
        - name: asset
          in: query
          description: >-
            **[Required]** The underlying currency for which there are futures
            contracts/instruments. 

            **[Examples]** ` BTC | ETH `
          required: true
          schema:
            type: string
            default: btc
        - name: startDate
          in: query
          description: >-
            **[Required]** Payload only includes data after this date
            (inclusive). 

            **[Formats]** `seconds | milliseconds | iso8601`

            **[Examples]** `1578531600 | 1578531600000 | 2020-09-01T01:00:00`
          required: true
          schema:
            type: string
            format: date-time
            default: '2024-11-01'
        - name: endDate
          in: query
          description: >-
            **[Required]** Payload only includes data before this date
            (exclusive). 

            **[Formats]** `seconds | milliseconds | iso8601`

            **[Examples]** `1578531600 | 1578531600000 | 2020-09-01T01:00:00`
          required: true
          schema:
            type: string
            default: '2024-11-04'
        - name: timeFormat
          in: query
          description: >-
            **[Optional]** Time format of the timestamps in the return payload.

            **[Defaults]** `milliseconds | ms* | iso | iso8601 | hr |
            human_readable`
          schema:
            type: string
      responses:
