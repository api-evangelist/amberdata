  /analytics/volatility/variance-premium:
    get:
      summary: Volatility Index VRP (variance risk premium)
      description: >-
        This endpoint returns the Deribit "DVol" index, shifted to align with
        historical realized volatility. Since option implied volatility is
        pricing future realized volatility, this endpoint helps users measure
        the accuracy of such expectation. When the VRP (variance risk premium)
        is positive, implied volatility was higher than future realized
        volatility, meaning options were over priced. Vice versa when VRP was
        negative. The Deribit DVol index has 30-days to maturity and the
        measured realized volatility uses a 30-day calculation window. Realized
        volatility is measured using the high/low "Parkinson" volatility method.
      operationId: derivatives-volatility-index-variance-risk-premium
      parameters:
        - name: currency
          in: query
          description: >-
            **[Optional]** The underlying currency for which to retrieve the
            volatility index. 

            **[Examples]** `BTC | SOL_USDC`  

            Note: inverse options have underlying currencies formatted as (BTC,
            ETH) while linear option currency formats include the stable coin in
            the same  (SOL_USDC)
          required: true
          schema:
            type: string
            default: BTC
        - name: timeFormat
          in: query
          description: >-
            **[Optional]** Time format of the timestamps in the return payload.

            **[Defaults]** `milliseconds | ms* | iso | iso8601 | hr |
            human_readable`
          schema:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  title:
                    type: string
                    example: OK
                  description:
                    type: string
                    example: Successful request
                  payload:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            timestamp:
                              type: integer
                              example: 1656806400000
                              description: The timestamp of the data in milliseconds
                            exchange:
                              type: string
                              example: deribit
                              description: >-
                                The exchange where the volatility index is
