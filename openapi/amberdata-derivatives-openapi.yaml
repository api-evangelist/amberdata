  /analytics/volatility/metrics:
    get:
      summary: Volatility Metrics (24 hr)
      description: >-
        This endpoint contains all the metrics useful for having an immediate
        overview of the options market, for each active expiry. The current Mark
        IV is updated every minute. These metrics are then compared according to
        the selected "daysBack" parameter. All the differences are found in the
        columns with the indication "change" (current metrics vs days ago
        metrics)
      operationId: derivatives-volatility-metrics
      parameters:
        - name: exchange
          in: query
          description: >-
            **[Required]**  The exchange for which to retrieve the listed option
            level 1 quotes. 

            **[Examples]** ` deribit | okex | bybit`
          required: true
          schema:
            type: string
            default: deribit
        - name: currency
          in: query
          description: >-
            **[Required]** The underlying currency for which there are listed
            option instruments. 

            **[Examples]** ` BTC | SOL_USDC `  

            Note: inverse options have underlying currencies formatted as (BTC,
            ETH) while linear option currency formats include the stable coin in
            the same  (SOL_USDC)
          required: true
          schema:
            type: string
            default: BTC
        - name: daysBack
          in: query
          description: >-
            **[Options]** This parameter sets the comparison date for the
            volatility metrics. No input will default the comparison between now
            and the past 24hrs. Users can input days back beyond 24hrs, such as
            7-days back, etc.
          schema:
            type: string
            format: date-time
            default: '3'
        - name: timeFormat
          in: query
          description: >-
            **[Optional]** Time format of the timestamps in the return payload.

            **[Defaults]** `milliseconds | ms* | iso | iso8601 | hr |
            human_readable`
          schema:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  title:
                    type: string
                    example: OK
                  description:
                    type: string
                    example: Successful request
