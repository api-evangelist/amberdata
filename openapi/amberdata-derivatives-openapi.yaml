                              description: The closing value of the Deribit DVol index
                            historicalVolatility30days:
                              type: number
                              example: 95.5
                              description: >-
                                The 30-day historical realized volatility using
                                Parkinson method
                            vrp30:
                              type: number
                              example: -22
                              description: >-
