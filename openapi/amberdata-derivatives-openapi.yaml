      parameters:
        - name: currency
          in: query
          description: >-
            **[Optional]** The underlying currency for which there are futures
            contracts/instruments. 

            **[Examples]** ` BTC | ETH `
          schema:
            type: string
            default: BTC
        - name: exchange
          in: query
          description: >-
            **[Optional]** The underlying exchange for which there are futures
            contracts/instruments. 

            **[Examples]** ` binance | deribit | bitmex `
          schema:
            type: string
            default: binance
        - name: startDate
          in: query
          description: >-
            **[Optional]** Payload only includes data after this date
            (inclusive). 

            **[Formats]** `seconds | milliseconds | iso8601`

            **[Examples]** `1578531600 | 1578531600000 | 2020-09-01T01:00:00`
          schema:
            type: string
        - name: endDate
          in: query
          description: >-
            **[Optional]** Payload only includes data before this date
            (exclusive). 

            **[Formats]** `seconds | milliseconds | iso8601`

            **[Examples]** `1578531600 | 1578531600000 | 2020-09-01T01:00:00`
          schema:
