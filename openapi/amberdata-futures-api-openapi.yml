        description: '**[Required]** The instrument(s) for which to retrieve the most current data (comma separated).  **[Maximum]** 50 instruments'
        required: true
        schema:
          type: string
          default: BTCUSDT,ETHUSDT
      - name: rateType
        in: query
        description: '**`applied`** (default): Returns only applied funding rates (historical, confirmed rates) **`predicted`**: Returns only predicted funding rates (future, expected rates)'
