            **[Optional]** The pair for which to retrieve the most current
            data.<BR/>**[Default]** All available pairs.
          schema:
            type: string
            default: btc_usd
        - name: direction
          in: query
          description: >-
            **[Optional]** The order in which to return the results, ordered by
            volumeUSD (ascending or descending). By default, records are
            returned in descending order, so the records with the largest volume
            are returned first.
          schema:
            type: string
            default: desc
        - name: startDate
          in: query
          description: >-
            **[Optional]** Payload only includes data after this date
            (inclusive).<BR>**[Formats]** `seconds | milliseconds |
            iso8601`<BR>**[Examples]** `1578531600 | 1578531600000 |
            2020-09-01T01:00:00`
          schema:
            type: string
        - name: endDate
          in: query
          description: >-
            **[Optional]** Payload only includes data before this date
            (exclusive).<BR>**[Formats]** `seconds | milliseconds |
            iso8601`<BR>**[Examples]** `1578531600 | 1578531600000 |
            2020-09-01T01:00:00`
          schema:
            type: string
        - name: timeFormat
          in: query
          description: >-
            **[Optional]** Time format of the timestamps in the return
            payload.<BR/>**[Defaults]** `milliseconds | ms* | iso | iso8601 | hr
            | human_readable`
          schema:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    status: 200
                    title: OK
                    description: Successful request
                    payload:
                      metadata:
                        startDate: 2022-03-10 00:00:00 000
                        endDate: 2022-03-11 10:00:00 000
                      data:
                        - exchange: gdax
                          pair: btc_usd
                          timestamp: 2022-03-10 00:00:00 000
                          volumeUSD: '820976607.01839280'
                        - exchange: gdax
                          pair: btc_usd
                          timestamp: 2022-03-11 00:00:00 000
                          volumeUSD: '616422583.44034633'
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                    default: 0
                  title:
                    type: string
                    example: OK
                  description:
                    type: string
                    example: Successful request
                  payload:
                    type: object
                    properties:
                      metadata:
                        type: object
                        properties:
                          startDate:
                            type: string
                            example: 2022-03-10 00:00:00 000
                          endDate:
                            type: string
                            example: 2022-03-11 10:00:00 000
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            exchange:
                              type: string
                              example: gdax
                            pair:
                              type: string
                              example: btc_usd
                            timestamp:
                              type: string
                              example: 2022-03-10 00:00:00 000
                            volumeUSD:
                              type: string
                              example: '820976607.01839280'
      deprecated: false
  /exchanges/{exchange}/pairs/volumes/latest:
    get:
      summary: Pair Volume Latest
      description: >-
        Retrieves the daily volume of pairs on each exchange over a rolling 24h
        period, updated hourly. The timestamp returned represents the beginning
        of the daily bar, following the same approach as OHLCV.
      operationId: market-metrics-exchanges-pairs-volumes-latest
      parameters:
        - name: exchange
          in: path
          description: The exchange for which to retrieve the requested data.
          schema:
            type: string
            default: gdax
          required: true
        - name: pair
          in: query
          description: >-
            **[Optional]** The pair for which to retrieve the most current data
            (ie. btc_usd, eth_usd, etc.).<BR/>**[Default]** All available pairs.
          schema:
            type: string
        - name: direction
          in: query
          description: >-
            **[Optional]** The order in which to return the results, ordered by
            volumeUSD (ascending or descending). By default, records are
            returned in descending order, so the records with the largest volume
            are returned first.
          schema:
            type: string
            default: desc
        - name: timeFormat
          in: query
          description: >-
            **[Optional]** Time format of the timestamps in the return
            payload.<BR/>**[Defaults]** `milliseconds | ms* | iso | iso8601 | hr
            | human_readable`
          schema:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value:
                    status: 200
                    title: OK
                    description: Successful request
                    payload:
                      data:
                        - exchange: gdax
                          pair: btc_usd
                          timestamp: 2022-03-13 14:00:00 000
                          volumeUSD: '417084146.60114834'
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                    default: 0
                  title:
                    type: string
                    example: OK
                  description:
                    type: string
                    example: Successful request
                  payload:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            exchange:
                              type: string
                              example: gdax
                            pair:
                              type: string
                              example: btc_usd
                            timestamp:
                              type: string
                              example: 2022-03-13 14:00:00 000
                            volumeUSD:
                              type: string
                              example: '417084146.60114834'
      deprecated: false
  /exchanges/{exchange}/assets/volumes/latest:
    get:
      summary: Asset Volume Latest
      description: >-
        Retrieves the daily volume of assets on each exchange over a rolling 24h
        period, updated hourly. The timestamp returned represents the beginning
        of the daily bar, following the same approach as OHLCV. **Note**: This
        endpoint excludes data from LMAX.
      operationId: market-metrics-exchanges-assets-volumes-latest
      parameters:
        - name: exchange
          in: path
          description: The exchange for which to retrieve the requested data.
          schema:
            type: string
            default: gdax
          required: true
        - name: asset
          in: query
          description: >-
            **[Optional]** The asset for which to retrieve the most current data
            (ie. btc, eth, etc.)<BR/>**[Default]** All available assets.
          schema:
            type: string
        - name: quoteVolume
          in: query
          description: '**[Optional]** Aggregate on quote volume instead of base volume.'
          schema:
            type: boolean
            default: false
        - name: direction
          in: query
          description: >-
            **[Optional]** The order in which to return the results, ordered by
            volumeUSD (ascending or descending). By default, records are
            returned in descending order, so the records with the largest volume
            are returned first.
          schema:
            type: string
            default: desc
        - name: timeFormat
          in: query
          description: >-
            **[Optional]** Time format of the timestamps in the return
