info:
  title: Amberdata Options API
  version: '1.0'
  description: 'Operations tagged Options across 2 of this provider''s published API definitions: amberdata-market-openapi.yaml, amberdata-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.amberdata.com/markets
- url: https://api.amberdata.com
  description: Amberdata REST API
