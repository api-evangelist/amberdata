  /spot/twap/pairs/{pair}/historical:
    get:
      summary: Pairs Historical
      description: >-
        Retrieves the historical TWAP for the specified pair - this is the
        global TWAP across all exchanges which supports this pair, including all
        cross rates pairs.


        Price is calculated as a time weighted moving average across all
        exchanges.


        If the parameter `exchange` is specified, the data returned is the TWAP
        for that pair on that exchange.
      operationId: spot-twap-pairs-historical
      parameters:
        - name: pair
          in: path
          description: The pair for which to retrieve the requested data.
          schema:
            type: string
            default: btc_usd
          required: true
        - name: exchange
          in: query
          description: >-
            **[Optional]** The exchange for which to retrieve the requested
            data.<br/>Note that daily vwap is not supported with this parameter.
          schema:
            type: string
        - name: includeCrossRates
          in: query
          description: >-
            **[Optional]** If true, cross rate pairs are included in the price &
            VWAP calculations - this option only supports pairs quoted in usd
            (ie `*_usd` pairs).<br/>**[Defaults]** `false* | true`
          schema:
            type: boolean
        - name: startDate
          in: query
          description: >-
            **[Optional]** Payload only includes data after this date
            (inclusive). <br>The interval can not exceed 12 months (d), 30 days
            (h) or 24 hours (m).<br>**[Formats]** `seconds | milliseconds |
            iso8601`<br>**[Examples]** `1578531600 | 1578531600000 |
            2020-09-01T01:00:00`
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          description: >-
            **[Optional]** Payload only includes data before this date
            (exclusive). <br>The interval can not exceed 12 months (d), 30 days
            (h) or 24 hours (m).<br>**[Formats]** `seconds | milliseconds |
            iso8601`<br>**[Examples]** `1578531600 | 1578531600000 |
            2020-09-01T01:00:00`
          schema:
            type: string
            format: date-time
        - name: timeInterval
          in: query
          description: >-
            **[Optional]** The time interval of the timeseries in the return
            payload.<br/>**[Defaults]** `m* | minute | h | hour | d | day`
          schema:
            type: string
        - name: lookbackPeriod
          in: query
          description: >-
            **[Optional]** Number of historical data points used in the
            calculation.<br/>**[Defaults]** `60 for minutely, 24 for hourly and
            20 for daily`
          schema:
            type: integer
            format: int32
        - name: timeFormat
          in: query
          description: >-
            **[Optional]** Time format of the timestamps in the return
            payload.<br/>**[Defaults]** `milliseconds | ms* | iso | iso8601 | hr
            | human_readable`
          schema:
            type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  title:
                    type: string
                    example: OK
                  description:
                    type: string
                    example: Successful request
                  payload:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp:
                          type: string
                          format: date-time
                          example: '2020-09-11T20:41:00.000Z'
                        pair:
                          type: string
                          example: btc_usd
                        price:
                          type: number
                          example: 10311.5
                        volume:
                          type: number
                          example: 0.1212
                        twap:
                          type: number
                          example: 10315.9
              examples:
                Result:
                  value:
                    status: 200
                    title: OK
                    description: Successful request
                    payload:
                      - timestamp: '2020-09-11T20:41:00.000Z'
