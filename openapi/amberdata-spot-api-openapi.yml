                          startDate: 1734426145880
                          endDate: 1739895592405
                        trade:
                          startDate: 1734426221718
                          endDate: 1739895250067
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                    default: 0
                  title:
                    type: string
                    example: OK
                  description:
                    type: string
                    example: Successful request
