              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  title:
                    type: string
                    example: OK
                  description:
                    type: string
                    example: Successful request
                  payload:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            exchange:
                              type: string
                              example: gdax
                              description: Exchange hosting the pair for VWAP/TWAP calculations
                            pair:
                              type: string
                              example: btc_usd
                              description: Underlying pair for VWAP/TWAP calculations
                            timestamp:
                              type: string
                              example: 2025-06-08 23:00:00 000
                              description: Timestamp reflecting the VWAP/TWAP calculations
                            totalVolumeUSD:
                              type: number
                              example: 17077624.10253145
                              description: Raw total volume in quote terms (often USD)
                            twap:
                              type: number
                              example: 105726.12016666665
                              description: Time-weighted average price. Underlying time increments are in minutes
                            vwap:
                              type: number
                              example: 105724.81842395054
                              description: Trade-weighted average price
      parameters:
      - name: pair
        in: query
        required: true
        description: '**[Required]** The currency pair for the spot instrument.

          **[Examples]** ` btc_usd | btc_usdc | eth_usd `'
        schema:
          type: string
          default: btc_usd
      - name: exchange
        in: query
        required: true
        description: '**[Required]** The exchange for which to retrieve listed spot instruments.

          **[Examples]** ` gdax | okex | binance | binanceus`'
        schema:
          type: string
          default: gdax
      - name: startDate
        in: query
        required: false
        description: "**[Optional]** Payload only includes data after this date (inclusive).\n**[Formats]** `seconds | milliseconds | iso8601` \n**[Examples]** `1578531600 | 1578531600000 | 2025-02-27`"
        schema:
          type: string
          default: '2025-06-01'
      - name: endDate
        in: query
        required: false
        description: "**[Optional]** Payload only includes data up to this date.\n**[Formats]** `seconds | milliseconds | iso8601` \n**[Examples]** `1578531600 | 1578531600000 | 2025-02-28`"
        schema:
          type: string
          default: '2025-06-02'
      - name: timeInterval
        in: query
        required: false
        description: "**[Optional]** Time interval of data frequency for the selected date range. \n**[Examples]** ` minute | hour | day`"
        schema:
          type: string
          default: day
      - name: timeFormat
        in: query
        required: false
        description: "**[Optional]** Time format of the timestamps in the return payload. \n**[Defaults]** `milliseconds | ms* | iso | iso8601 | hr | human_readable`"
        schema:
          type: string
          default: hr
      - name: orderSizeCategoryUsd
        in: query
        required: true
        description: '**[Required]** Users can specify to return all aggregated trades, or trades of a specific size threshold. (0-1k, 1k-10k, 10k-100k, 100k+, ALL) by passing in the lower value of the range ` 0 | 1k | 10k | 100k | All `'
        schema:
          type: string
          default: All
      security:
      - ApiKeyAuth: []
      tags:
      - Trade
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
x-readme:
  headers: []
  explorer-enabled: true
  proxy-enabled: true
x-readme-fauxas: true
