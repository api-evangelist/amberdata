                        startDate: 2025-01-01 00:02:00 000
                      - endDate: 2025-04-02 11:43:00 000
                        exchange: gdax
                        pair: aave_btc
                        startDate: 2025-03-12 13:11:00 000
                      - endDate: 2025-04-02 11:44:00 000
                        exchange: gdax
                        pair: aave_eur
                        startDate: 2025-03-12 13:11:00 000
                      - endDate: 2025-04-02 11:32:00 000
                        exchange: gdax
                        pair: aave_gbp
                        startDate: 2025-03-12 13:11:00 000
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
